name: Actualizar CONOSCE

on:
  workflow_dispatch:

jobs:
  conectar-neon:
    runs-on: ubuntu-latest

    env:
      DB_HOST: prueba
      DB_NAME: prueba
      DB_USER: prueba
      DB_PASSWORD: prueba
      DB_PORT: "5432"

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: |
          pip install -r etl/requirements.txt

      - name: Ejecutar conexión
        run: |
          python etl/etl/main.py
